useCase: |
  ## Use Case

  ### The problem

  Finding information about Members of Parliament today means using
  `members.parliament.uk` the traditional way. You type a name, constituency
  or postcode into a search bar, open a profile page, and put the answer
  together yourself. That works for a single lookup like *"who is the MP for
  Aldershot?"*. It doesn't work for the questions people actually ask:

  - *Which MPs got elected in 2025?*
  - *How many Labour MPs are there in Wales?*
  - *Which seats changed hands at the last general election?*
  - *Which constituencies had the smallest majorities?*
  - *Tell me about the MP for a seat near Birmingham.*

  None of these fit a keyword search box. Each one needs filtering,
  counting or comparing across all 650 constituencies, or understanding
  what the user meant.

  ### The goal

  Ask about MPs in natural language and get a correct answer, instead of
  searching and clicking through profiles.

  ### Approach: deterministic + probabilistic

  Questions about MPs come in two kinds, and each kind needs a different
  way of answering:

  | | Deterministic | Probabilistic |
  |---|---|---|
  | **What it is** | Exact queries over structured fields: filter, count, sort, aggregate | Semantic search (RAG) over text, with an LLM writing the answer |
  | **Good for** | *"Which MPs got elected in 2025?"*, *"How many Conservative MPs are there?"*, *"Top 10 smallest majorities"* | *"Tell me about the MP for Aldershot"*, *"Who represents the South East?"*, vague or badly spelled questions |
  | **Strength** | Exact, complete and repeatable, with no made-up answers | Handles fuzzy wording, synonyms and open-ended questions |
  | **Weakness** | Needs the question mapped onto known fields | May miss records or give only part of a list, so it can't be trusted for "all" or "how many" |

  An LLM on its own is poor at *"list every MP elected in 2025"*. Vector
  search returns the top-k most similar documents, not every match, so the
  list can come back incomplete. A fixed query can't handle open-ended or
  misspelled questions. This project combines the two. The agent works out
  what kind of question it has been asked. Precise questions go to
  structured queries over the dataset. Descriptive or fuzzy questions go
  to RAG over the constituency documents.

  ### The data underneath

  Both approaches read from the same dataset: one structured record per
  constituency, covering all 650. Each record has the current MP, their
  party, the date they became an MP, the region, and the latest general
  election result (electorate, turnout, majority, and whether the seat was
  held or gained). The *Data Collection* tab explains how it was gathered.
  The *RAG* tab shows the probabilistic side on its own.

dataCollection: |
  ## Data Collection

  `members.parliament.uk` blocks direct HTML scraping — every request without
  a real browser gets a `403 Forbidden` with a Cloudflare JS challenge. The
  site turned out to be a frontend for a public, unauthenticated JSON API at
  `members-api.parliament.uk`, which has no bot protection and returns the
  same underlying data in structured form. That API is the actual data
  source here.

  **Base URL:** `https://members-api.parliament.uk/api/Location/Constituency`

  | Purpose | Endpoint | Notes |
  |---|---|---|
  | List all constituencies | `GET /Search?searchText=&skip={n}&take={n}` | Paginated. `totalResults` gives the total (650). Each item's `value.id` is the numeric constituency code, e.g. `4496`. |
  | Overview | `GET /{id}` | Name, dates, current MP, party, membership history. |
  | Synopsis | `GET /{id}/Synopsis` | One-line summary, e.g. *"Aberafan Maesteg is a constituency in Wales. The seat has been held by Stephen Kinnock (Labour) since July 2024."* HTML-stripped into a plain-text `location` field. |
  | Election history | `GET /{id}/ElectionResults` | Result, electorate, turnout, majority, winning party. Boundaries changed in July 2024, so this currently holds just the 2024 general election per constituency — same as the live site. |
  | Boundary geometry | `GET /{id}/Geometry` | GeoJSON `MultiPolygon`. Fetched during collection, deliberately excluded from the final output (large, not needed downstream). |

  No API key required.

  **Collection script:** [`scripts/generate_uk_constituencies.mjs`](scripts/generate_uk_constituencies.mjs)

  ```bash
  node scripts/generate_uk_constituencies.mjs
  ```

  No dependencies — Node's built-in `fetch`. Paginates through `/Search`, then
  fetches `overview` + `Synopsis` + `ElectionResults` for all 650
  constituencies (8 concurrent, one constituency's 3 requests done
  sequentially — parallelizing those too tripped the API's rate limiting),
  retries with backoff, and writes a single JSON **array**
  (`output/uk_constituencies.json`) — one object per constituency, so it can
  be iterated or bulk-imported into whatever downstream store or app needs
  it without any further reshaping.

